spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfoliomanager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:devuser}
    password: ${DB_PASS:devpass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none     # Flyway manages schema, not Hibernate. Set to 'none' to prevent validation errors
      naming:
        # Physical naming strategy to convert camelCase to snake_case
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 500
          order_inserts: true
          order_updates: true
    show-sql: false
  sql:
    init:
      continue-on-error: false

flyway:
  enabled: true
  clean-disabled: true
  defer-datasource-initialization: true
  locations: classpath:db/migration
  baseline-on-migrate: true
  baseline-version: 1
  baseline-description: Initial Schema
  validate-on-migrate: false
  out-of-order: true
  repair-on-migrate: true
  placeholder-replacement: false
  ignore-failed-future-migration: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-super-secret-key-minimum-32-characters-long-for-hs256-algorithm}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}  # 30 minutes in milliseconds
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds

# App-specific properties for AMFI ingestion
amfi:
  daily:
    cron: "0 30 20 * * ?"
  nav:
    url: https://portal.amfiindia.com/spages/NAVAll.txt
    fallback-url: https://www.amfiindia.com/spages/NAVAll.txt
    cron: 0 15 5 * * ?        # example: daily at 05:15 server time (adjust as needed)
    connection-timeout-ms: 20000
    read-timeout-ms: 60000
    user-agent: Investment-Tracker/1.0
    allow-insecure-ssl-fallback: true

external:
  api:
    base-url: https://localhost:8080
    connect-timeout-ms: 2000
    read-timeout-ms: 5000


# Logging & server
server:
  port: 8080

logging:
  level:
    root: INFO
    com.example: DEBUG

