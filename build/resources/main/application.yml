spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/portfolio_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:youruser}
    password: ${DB_PASS:yourpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate     # use 'validate' in dev; Flyway will manage schema
    properties:
      hibernate:
        format_sql: true
    show-sql: true

flyway:
  enabled: true
  defer-datasource-initialization: true
  locations: classpath:db/migration

# App-specific properties for AMFI ingestion
amfi:
  nav:
    url: https://portal.amfiindia.com/spages/NAVAll.txt
    cron: 0 15 5 * * ?        # example: daily at 05:15 server time (adjust as needed)
    connection-timeout-ms: 20000
    read-timeout-ms: 60000
    user-agent: Investment-Tracker/1.0

# Logging & server
server:
  port: 8080

logging:
  level:
    root: INFO
    com.yourorg: DEBUG

